const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(p) {
  const imgs = p.images.map(i => `<img src="${esc(i.url)}" alt="${esc(i.type)}" loading="lazy">`).join('');
  const multi = p.images.length > 1;
  return `
  <div class="card ${esc(p.platform)}" data-n="${p.images.length}">
    <div class="head">${esc(p.platform)}</div>
    <div class="slider">
      <div class="track">${imgs}</div>
      ${multi ? `<button class="nav prev">‹</button><button class="nav next">›</button>
      <div class="counter">1 / ${p.images.length}</div>` : ''}
    </div>
    ${multi ? `<div class="dots">${p.images.map((_, i) => `<span class="dot${i ? '' : ' on'}"></span>`).join('')}</div>` : ''}
  </div>`;
}

const days = {};
posts.forEach(p => (days[p.post_date] ||= []).push(p));
document.getElementById('app').innerHTML = Object.keys(days).sort().map(d =>
  `<section class="day"><h2>${d}</h2><div class="row">${days[d].map(card).join('')}</div></section>`
).join('');

// slider behaviour
document.querySelectorAll('.card').forEach(c => {
  const n = +c.dataset.n;
  if (n < 2) return;
  let i = 0;
  const track = c.querySelector('.track'), dots = c.querySelectorAll('.dot'), counter = c.querySelector('.counter');
  const go = k => {
    i = (k + n) % n;
    track.style.transform = `translateX(-${i * 100}%)`;
    dots.forEach((d, j) => d.classList.toggle('on', j === i));
    counter.textContent = `${i + 1} / ${n}`;
  };
  c.querySelector('.prev').onclick = () => go(i - 1);
  c.querySelector('.next').onclick = () => go(i + 1);
});
